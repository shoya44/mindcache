<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>MindCache</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="header glass">
      <div class="header-left">
        <span class="icon-btn" id="searchToggle">🔍</span>
      </div>
      <div class="header-center">
        <span id="syncStatus">🔄 Synced</span>
      </div>
      <div class="header-right">
        <span class="icon-btn" id="exportBtn" title="Export data">⬇️</span>
        <span class="icon-btn" id="importBtn" title="Import data">⬆️</span>
        <span class="icon-btn" id="reloadBtn">↻</span>
      </div>
    </header>

    <!-- 検索バー -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search..." class="search-input glass">
    </div>

    <!-- メインコンテンツ -->
    <main id="mainContent">
      <!-- ピン留めセクション -->
      <section id="pinnedSection" style="display:none;">
        <div class="section-label">📌 Pinned</div>
        <div id="pinnedList"></div>
      </section>

      <!-- 全メモセクション -->
      <section id="allSection">
        <div class="section-label">All Memos</div>
        <div id="memoList"></div>
      </section>

      <!-- もっと読み込むボタン -->
      <button id="loadMoreBtn" style="display:none;" class="load-more-btn glass">Load More</button>
    </main>

    <!-- FAB（新規追加） -->
    <button id="fab" class="fab glass">✨</button>
  </div>

  <!-- モーダル用オーバーレイ -->
  <div id="modalOverlay" style="display:none;">
    <div class="modal glass">
      <div class="modal-header">
        <span class="modal-back" id="modalBack">← Back</span>
        <span class="modal-save" id="modalSave">✨ Save</span>
      </div>
      <div class="modal-body">
        <div class="modal-title-row">
          <input type="text" id="modalTitle" placeholder="Title (optional)" class="modal-title-input">
          <span class="pin-toggle" id="pinToggle">📌</span>
        </div>
        <textarea id="modalContent" placeholder="Content..." class="modal-content-input"></textarea>
        <div class="modal-attachments">
          <div class="attachments-header">
            <span>Attachments</span>
            <button id="addFileBtn" class="add-file-btn">＋ Add File</button>
          </div>
          <div id="attachmentList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div id="detailOverlay" style="display:none;">
    <div class="modal glass">
      <div class="modal-header">
        <span class="modal-close" id="detailClose">✕ Close</span>
        <span class="modal-edit" id="detailEdit">✏️ Edit</span>
        <span class="modal-delete" id="detailDelete">🗑️ Delete</span>
      </div>
      <div class="modal-body detail-body">
        <h2 id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-content" id="detailContent"></div>
        <button class="copy-btn" id="detailCopy">📋 Copy All</button>
        <div class="detail-attachments">
          <div class="attachments-header">Attachments</div>
          <div id="detailAttachmentList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sync Key 入力オーバーレイ -->
  <div id="syncKeyOverlay" style="display:none;">
    <div class="modal glass">
      <div class="modal-header">
        <span>🔑 Sync Key</span>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">Enter your Sync Key to continue.</p>
        <input type="text" id="syncKeyInput" placeholder="Sync Key" class="modal-title-input" style="width:100%;">
        <button id="syncKeySubmit" class="copy-btn" style="margin-top:16px;">Continue</button>
      </div>
    </div>
  </div>

  <!-- 削除確認オーバーレイ -->
  <div id="confirmOverlay" style="display:none;">
    <div class="modal glass">
      <div class="modal-header">
        <span>Delete this memo?</span>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">This cannot be undone.</p>
        <button id="confirmCancel" class="copy-btn">Cancel</button>
        <button id="confirmOk" class="copy-btn" style="color:#EF4444;margin-top:8px;">Delete</button>
      </div>
    </div>
  </div>

  <!-- インポート方式選択オーバーレイ -->
  <div id="importModeOverlay" style="display:none;">
    <div class="modal glass">
      <div class="modal-header">
        <span>📥 Import Data</span>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">Choose how to import the selected file.</p>
        <button id="importAppendBtn" class="copy-btn">Append（既存データに追加）</button>
        <button id="importOverwriteBtn" class="copy-btn" style="color:#EF4444;margin-top:8px;">Overwrite（既存データを置き換え）</button>
        <button id="importCancelBtn" class="copy-btn" style="margin-top:8px;">Cancel</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFileInput" accept="application/json" style="display:none;">

  <!-- トースト -->
  <div id="toast" class="toast"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
