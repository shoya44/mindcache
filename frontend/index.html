<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfc">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>MindCache</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- アイコン定義：symbol + viewBox でセンタリングのズレを防止 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5l1.8 6 6 1.8-4.9 3.4 1.4 6.3-4.3-3.9-4.3 3.9 1.4-6.3-4.9-3.4 6-1.8z"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 3h14"/>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14"/><path d="M5 12h14"/>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
      </symbol>
      <symbol id="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.5l-8.5 8.5a4 4 0 0 1-5.7-5.7l8.5-8.5a2.6 2.6 0 0 1 3.7 3.7L10.8 19.3"/>
      </symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- ヘッダー -->
    <header class="header glass">
      <div class="header-left">
        <span class="icon-btn" id="searchToggle"><svg class="icon"><use href="#i-search"/></svg></span>
      </div>
      <div class="header-center">
        <span id="syncStatus">Synced</span>
      </div>
      <div class="header-right">
        <span class="icon-btn" id="exportBtn" title="Export data"><svg class="icon"><use href="#i-download"/></svg></span>
        <span class="icon-btn" id="importBtn" title="Import data"><svg class="icon"><use href="#i-upload"/></svg></span>
        <span class="icon-btn" id="reloadBtn"><svg class="icon"><use href="#i-refresh"/></svg></span>
      </div>
    </header>

    <!-- 検索バー -->
    <div class="search-container search-wrap">
      <svg class="icon search-icon"><use href="#i-search"/></svg>
      <input type="text" id="searchInput" placeholder="Search..." class="search-input">
    </div>

    <!-- メインコンテンツ -->
    <main id="mainContent">
      <!-- ピン留めセクション -->
      <section id="pinnedSection" style="display:none;">
        <div class="section-label"><svg class="icon"><use href="#i-pin"/></svg>Pinned</div>
        <div id="pinnedList"></div>
      </section>

      <!-- 全メモセクション -->
      <section id="allSection">
        <div class="section-label">All Memos</div>
        <div id="memoList"></div>
      </section>

      <!-- もっと読み込むボタン -->
      <button id="loadMoreBtn" style="display:none;" class="load-more-btn">Load More</button>
    </main>

    <!-- FAB（新規追加） -->
    <button id="fab" class="fab"><svg class="icon"><use href="#i-plus"/></svg></button>
  </div>

  <!-- モーダル用オーバーレイ -->
  <div id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-back" id="modalBack"><svg class="icon"><use href="#i-back"/></svg>Back</span>
        <span class="modal-save" id="modalSave">Save</span>
      </div>
      <div class="modal-body">
        <div class="modal-title-row">
          <input type="text" id="modalTitle" placeholder="Title (optional)" class="modal-title-input">
          <span class="pin-toggle" id="pinToggle"><svg class="icon"><use href="#i-pin"/></svg></span>
        </div>
        <textarea id="modalContent" placeholder="Content..." class="modal-content-input"></textarea>
        <div class="modal-attachments">
          <div class="attachments-header">
            <span>Attachments</span>
            <button id="addFileBtn" class="add-file-btn"><svg class="icon"><use href="#i-clip"/></svg>Add File</button>
          </div>
          <div id="attachmentList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div id="detailOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-close" id="detailClose"><svg class="icon"><use href="#i-close"/></svg>Close</span>
        <span class="modal-edit" id="detailEdit"><svg class="icon"><use href="#i-edit"/></svg>Edit</span>
        <span class="modal-delete" id="detailDelete"><svg class="icon"><use href="#i-trash"/></svg>Delete</span>
      </div>
      <div class="modal-body detail-body">
        <h2 id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-content" id="detailContent"></div>
        <button class="copy-btn" id="detailCopy"><svg class="icon"><use href="#i-copy"/></svg>Copy All</button>
        <div class="detail-attachments">
          <div class="attachments-header">Attachments</div>
          <div id="detailAttachmentList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sync Key 入力オーバーレイ -->
  <div id="syncKeyOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span>Sync Key</span>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">Enter your Sync Key to continue.</p>
        <input type="text" id="syncKeyInput" placeholder="Sync Key" class="modal-title-input" style="width:100%;">
        <button id="syncKeySubmit" class="btn-primary" style="margin-top:16px;">Continue</button>
      </div>
    </div>
  </div>

  <!-- 削除確認オーバーレイ -->
  <div id="confirmOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span>Delete this memo?</span>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">This cannot be undone.</p>
        <button id="confirmCancel" class="btn-secondary">Cancel</button>
        <button id="confirmOk" class="btn-primary btn-danger" style="margin-top:8px;">Delete</button>
      </div>
    </div>
  </div>

  <!-- インポート方式選択オーバーレイ -->
  <div id="importModeOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span>Import Data</span>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Choose how to import the selected file.</p>
        <button id="importAppendBtn" class="btn-secondary">Append（既存データに追加）</button>
        <button id="importOverwriteBtn" class="btn-primary btn-danger" style="margin-top:8px;">Overwrite（既存データを置き換え）</button>
        <button id="importCancelBtn" class="btn-secondary" style="margin-top:8px;">Cancel</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFileInput" accept="application/json" style="display:none;">

  <!-- トースト -->
  <div id="toast" class="toast"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
